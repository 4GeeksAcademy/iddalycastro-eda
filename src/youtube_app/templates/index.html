<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Predicción de Vistas | YouTube Top 100</title>
  <style>
    body { font-family: Inter, system-ui, Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .card { width:100%; max-width:720px; background:#111827; border:1px solid #1f2937; border-radius:18px; padding:24px; box-shadow:0 20px 45px rgba(0,0,0,.35); }
    h1 { margin:0 0 6px; font-size:26px; }
    p.sub { margin:0 0 18px; color:#94a3b8; }
    form { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    label { font-weight:600; font-size:14px; color:#cbd5e1; }
    input, select { width:100%; padding:12px 14px; border-radius:12px; border:1px solid #374151; background:#0b1220; color:#e5e7eb; }
    input:focus, select:focus { border-color:#60a5fa; outline:none; box-shadow:0 0 0 3px rgba(96,165,250,.2); }
    .row-2 { grid-column: span 2; }
    .actions { display:flex; gap:12px; grid-column: span 2; }
    button { padding:12px 18px; border-radius:12px; border:0; font-weight:700; cursor:pointer; }
    .btn-primary { background:#3b82f6; color:#fff; }
    .btn-secondary { background:#334155; color:#e2e8f0; }
    .result { margin-top:18px; padding:16px; background:#0b1220; border:1px solid #1f2937; border-radius:12px; }
    .error { color:#fda4af; font-weight:600; margin-top:12px; }
    .footer { margin-top:10px; color:#64748b; font-size:12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Predicción de Vistas</h1>
    <p class="sub">Introduce los datos y estima las vistas esperadas del video.</p>

    <form method="POST">
      <div>
        <label>Duración (segundos)</label>
        <input type="number" name="duration" step="1" min="0" value="{{ inputs.get('duration','') }}" required />
      </div>
      <div>
        <label>Seguidores del canal</label>
        <input type="number" name="followers" step="1" min="0" value="{{ inputs.get('followers','') }}" required />
      </div>
      <div class="row-2">
        <label>¿Es en vivo?</label>
        <select name="live_status">
          <option value="False" {{ 'selected' if inputs.get('live_status','False')=='False' else '' }}>No</option>
          <option value="is_live" {{ 'selected' if inputs.get('live_status')=='is_live' else '' }}>Sí (live)</option>
          <option value="was_live" {{ 'selected' if inputs.get('live_status')=='was_live' else '' }}>Fue live</option>
        </select>
      </div>
      <div class="actions">
        <button class="btn-primary" type="submit">Predecir</button>
        <button class="btn-secondary" type="reset" onclick="window.location='/'">Limpiar</button>
      </div>
    </form>

    {% if prediction is not none %}
      <div class="result">
        <h3 style="margin:10px 0 0">Vistas estimadas: {{ '{:,}'.format(prediction) }}</h3>
      </div>
    {% endif %}

    {% if error %}
      <div class="error">Error: {{ error }}</div>
    {% endif %}

    <div class="footer">Modelo: Random Forest con objetivo log-transformado (3 inputs).</div>
  </div>
</body>
</html>
